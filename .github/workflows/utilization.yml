name: Weekly utilization report

on:
  schedule:
    - cron: "0 14 * * 2"   # Tuesdays 14:00 UTC, after Monday night games and the nflverse overnight refresh
    - cron: "0 14 * * 3"   # Wednesday retry in case snap counts lagged
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: utilization
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pyarrow
      - name: Build report
        working-directory: utilization
        run: python3 build_utilization.py --season 2026 --out data
      - name: Commit changes
        run: |
          git add utilization/data
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git config user.name "utilization"
          git config user.email "utilization@users.noreply.github.com"
          git commit -m "Utilization report $(TZ=America/Los_Angeles date '+%Y-%m-%d')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
