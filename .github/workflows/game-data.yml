name: Vegas lines, projections and Kalshi markets

on:
  schedule:
    - cron: "47 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: game-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch lines and projections
        run: python3 scripts/game_data.py
      - name: Fetch Kalshi sports markets
        run: python3 scripts/kalshi_data.py || echo "Kalshi snapshot failed; keeping the last one"
      - name: Commit changes
        run: |
          git add games.json kalshi.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "game-data"
          git config user.email "game-data@users.noreply.github.com"
          git commit -m "Game data $(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M PT')"
          for i in 1 2 3; do
            # generated files: on a conflict keep this run's fresh copy
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
