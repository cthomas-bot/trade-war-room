<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060d1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Trade War Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060d1a;--panel:rgba(12,25,46,.82);--panel2:rgba(20,40,72,.55);--line:rgba(120,170,255,.16);--line2:rgba(120,170,255,.28);
  --text:#e9f1ff;--dim:#8ea3c4;--dim2:#5d7396;
  --good:#3ee88f;--warn:#ffc247;--bad:#ff5468;
  --QB:#ff5c8a;--K:#9aa8bd;--DEF:#7d8aa3;--RB:#2ee6a6;--WR:#4cb8ff;--TE:#ffb340;--PICK:#b18cff;
  --acc:#ff7b1c;--acc2:#ffc247;--acc-rgb:255,123,28;
  --disp:'Oswald','Arial Narrow',Impact,sans-serif;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:dark;
}
body[data-mode=redraft]{--acc:#19d3ff;--acc2:#8cff5a;--acc-rgb:25,211,255}
body[data-mode=bets]{--acc:#b98cff;--acc2:#ffd36b;--acc-rgb:185,140,255}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
body{
  background:
    radial-gradient(1100px 520px at 8% -8%,rgba(var(--acc-rgb),.20),transparent 60%),
    radial-gradient(900px 600px at 105% 0%,rgba(76,120,255,.18),transparent 60%),
    linear-gradient(rgba(120,170,255,.045) 1px,transparent 1px) 0 0/28px 28px,
    linear-gradient(90deg,rgba(120,170,255,.045) 1px,transparent 1px) 0 0/28px 28px,
    var(--bg);
  background-attachment:fixed;transition:background .4s;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc)!important;outline-offset:2px}
.hide{display:none!important}
.muted{color:var(--dim)}
.disp{font-family:var(--disp);text-transform:uppercase;letter-spacing:.04em}
/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(6,13,26,.78);backdrop-filter:saturate(160%) blur(18px);-webkit-backdrop-filter:saturate(160%) blur(18px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1560px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-size:20px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.brand .mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#071021;font-size:18px;box-shadow:0 0 18px rgba(var(--acc-rgb),.55)}
.brand b{color:var(--acc)}
.modes{display:flex;background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:14px;padding:4px;gap:4px}
.modes button{display:flex;flex-direction:column;align-items:flex-start;padding:7px 16px;border-radius:10px;color:var(--dim);transition:background .25s,color .25s,box-shadow .25s;min-width:150px}
.modes button b{font-family:var(--disp);font-size:16px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.modes button small{font-size:11px;opacity:.8}
.modes button[aria-pressed=true]{color:#071021;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 0 22px rgba(var(--acc-rgb),.45)}
.tools{display:flex;align-items:center;gap:10px}
.btn{border:1px solid var(--line2);background:rgba(255,255,255,.05);border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#071021;border:0;text-decoration:none;display:inline-block}
.stamp{font-size:12px;color:var(--dim);white-space:nowrap}
@media (max-width:1100px){.modes button{min-width:0;padding:7px 12px}.modes button small{display:none}}
@media (max-width:760px){#refresh{font-size:0;padding:7px 10px}#refresh::before{content:'↻';font-size:16px}.brand .mark{width:30px;height:30px}.modes{padding:3px;gap:2px}.modes button{padding:6px 8px!important}.modes button b{font-size:13px!important;letter-spacing:.04em!important}}
@media (max-width:760px){.brand span{display:none}.modes button{min-width:0;padding:6px 10px}.modes button b{font-size:14px}.modes button small{display:none}.stamp{display:none}.top-in{padding:8px 12px;gap:8px}}
/* ---------- page ---------- */
.wrap{max-width:1560px;margin:0 auto;padding:18px 20px 60px}
@media (max-width:760px){.wrap{padding:14px 12px 50px}}
.msg{margin:10px 0;padding:12px 16px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);font-size:14px}
.msg.err{border-color:rgba(255,84,104,.5);background:rgba(255,84,104,.1)}
.loading{display:flex;align-items:center;gap:12px;padding:40px 4px;color:var(--dim)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--acc);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* hero */
.hero{position:relative;display:flex;align-items:center;gap:18px;padding:18px 22px;border-radius:20px;border:1px solid var(--line2);overflow:hidden;
  background:linear-gradient(120deg,rgba(var(--acc-rgb),.20),rgba(12,25,46,.85) 45%),var(--panel);margin-bottom:16px}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 2px,transparent 2px 9px);pointer-events:none}
.hero .av{width:64px;height:64px;border-radius:16px;background:#0b1830 center/cover;border:2px solid var(--acc);box-shadow:0 0 22px rgba(var(--acc-rgb),.4);flex:none;display:grid;place-items:center;font-family:var(--disp);font-size:26px;overflow:hidden}
.hero .av{position:relative}.hero .av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero h1{margin:0;font-family:var(--disp);font-weight:700;font-size:clamp(24px,3.4vw,40px);line-height:1;letter-spacing:.03em;text-transform:uppercase}
.hero h1 em{font-style:normal;color:var(--acc)}
.hero .sub{color:var(--dim);margin-top:6px;font-size:14px}
.hero .pills{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;position:relative;z-index:1}
.pill{display:flex;flex-direction:column;align-items:center;min-width:64px;padding:6px 10px;border-radius:12px;background:rgba(6,13,26,.6);border:1px solid var(--line2)}
.pill b{font-family:var(--disp);font-size:20px;line-height:1.1;color:var(--acc2)}
.pill small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
@media (max-width:760px){.hero{flex-wrap:wrap;padding:14px}.hero .pills{margin-left:0;justify-content:flex-start}.hero .av{width:52px;height:52px}}
/* grid */
.grid{display:grid;gap:16px;grid-template-columns:minmax(260px,320px) minmax(0,1fr) minmax(280px,360px);grid-template-areas:"a b c";align-items:start}
.colA{grid-area:a}.colB{grid-area:b}.colC{grid-area:c}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:1240px){.grid{grid-template-columns:minmax(0,1fr) minmax(280px,340px);grid-template-areas:"b a" "b c"}}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"b" "a" "c"}}
/* panels */
.pn{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 12px 32px rgba(0,0,0,.35);min-width:0}
.pn::before{content:"";position:absolute;top:-1px;left:18px;width:46px;height:3px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.ph h2{margin:0;font-family:var(--disp);font-weight:600;font-size:17px;letter-spacing:.09em;text-transform:uppercase}
.ph h2 i{font-style:normal;color:var(--acc);margin-right:6px}
.ph small{font-size:12px;color:var(--dim)}
.pn.glow{border-color:rgba(var(--acc-rgb),.45);box-shadow:0 0 0 1px rgba(var(--acc-rgb),.15),0 0 30px rgba(var(--acc-rgb),.12),0 12px 32px rgba(0,0,0,.35)}
/* faces */
.hs{--s:40px;--pc:var(--dim2);position:relative;flex:none;width:var(--s);height:var(--s);border-radius:50%;overflow:hidden;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.10),rgba(255,255,255,.02) 70%),#0b1830;border:2px solid var(--pc);box-shadow:0 0 0 2px rgba(6,13,26,.8)}
.hs i{font-style:normal;font-family:var(--disp);font-size:calc(var(--s)*.36);color:var(--pc);letter-spacing:.02em}
.hs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.hs.sq{border-radius:12px}
.tl{width:18px;height:18px;object-fit:contain;vertical-align:-4px;flex:none}
.pos{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.05em;padding:2px 6px;border-radius:6px;color:#071021;background:var(--pc,var(--dim))}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.t-good{color:var(--good)}.t-warn{color:var(--warn)}.t-bad{color:var(--bad)}.t-acc{color:var(--acc)}.t-dim{color:var(--dim)}
.up{color:var(--good)}.down{color:var(--bad)}
.num{font-variant-numeric:tabular-nums}
/* player rows */
.plist{display:flex;flex-direction:column}
.prow{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:12px;cursor:pointer;min-width:0;text-align:left;width:100%}
.prow+.prow{border-top:1px solid var(--line)}
.prow:hover{background:rgba(255,255,255,.04)}
.prow .nm{min-width:0;flex:1}
.prow .nm>b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .nm small{display:flex;align-items:center;gap:5px;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden}
.prow .rt{text-align:right;flex:none}
.prow .rt b{display:block;font-family:var(--disp);font-size:18px;font-weight:600}
.prow .rt small{font-size:11px;color:var(--dim)}
.slot{width:34px;flex:none;font-size:10px;font-weight:800;letter-spacing:.04em;color:var(--dim);text-align:center}
/* blueprint card */
.bp-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bp-k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700}
.bp-v{font-family:var(--disp);font-size:20px;line-height:1.1;text-transform:uppercase;margin-top:2px}
.ring{--p:50;--c:var(--acc);width:112px;height:112px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.07) 0);position:relative}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:#0a1730;box-shadow:inset 0 0 18px rgba(0,0,0,.6)}
.ring div{position:relative;text-align:center}
.ring b{font-family:var(--disp);font-size:36px;line-height:1;display:block}
.ring small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.outlook{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.ob{font-family:var(--disp);font-size:14px;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;border-radius:8px;border:1px solid currentColor}
.ob small{display:block;font-family:var(--font);font-size:9px;letter-spacing:.1em;opacity:.8}
/* grades */
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gr{display:flex;flex-direction:column;align-items:center;gap:4px}
.gr .g{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-size:24px;font-weight:700;color:#071021;background:var(--gc);box-shadow:0 0 16px color-mix(in srgb,var(--gc) 55%,transparent),inset 0 -4px 0 rgba(0,0,0,.18)}
.gr small{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:620px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:14px;border-radius:16px;border:1px solid var(--line2);background:linear-gradient(160deg,rgba(var(--acc-rgb),.16),rgba(12,25,46,.85) 60%)}
.kpi small{display:block;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.kpi b{display:block;font-family:var(--disp);font-size:30px;line-height:1.15}
.kpi span{font-size:12px;color:var(--dim)}
/* roster board */
.rboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.rcol{border-radius:14px;background:rgba(6,13,26,.45);border:1px solid var(--line);overflow:hidden;min-width:0}
.rcol h3{margin:0;padding:8px 10px;font-family:var(--disp);font-size:14px;letter-spacing:.12em;color:#071021;background:var(--pc);display:flex;justify-content:space-between}
.rcol h3 small{font-family:var(--font);font-size:11px;font-weight:700;letter-spacing:0}
.rcol .prow{padding:6px 8px;gap:8px;border-radius:0}
.rcol .prow .rt b{font-size:15px}
.tier{width:3px;align-self:stretch;border-radius:2px;flex:none}
/* trades */
.ctrls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:10px;padding:2px;gap:2px}
.seg button{border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--dim)}
.seg button[aria-pressed=true]{background:rgba(var(--acc-rgb),.22);color:var(--text);box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.6)}
.trade{border-radius:16px;border:1px solid var(--line2);background:rgba(6,13,26,.5);margin-top:12px;overflow:hidden}
.trade.best{border-color:rgba(var(--acc-rgb),.6);box-shadow:0 0 26px rgba(var(--acc-rgb),.15)}
.tr-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tr-h>span:first-child{display:flex;align-items:center;gap:8px;min-width:0}.tr-h b{font-family:var(--disp);letter-spacing:.06em;text-transform:uppercase;font-size:15px}
.meter{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);font-weight:600}
.meter span{width:80px;height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.meter span i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.tr-b{display:grid;grid-template-columns:minmax(0,1fr) 54px minmax(0,1fr);align-items:center;padding:12px 10px}
.tr-side{display:flex;flex-direction:column;gap:6px;min-width:0}
.tr-side .lbl{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding-left:6px}
.give .lbl{color:var(--bad)}.get .lbl{color:var(--good)}
.tr-side .prow{padding:5px 6px}
.tr-x{display:grid;place-items:center}
.tr-x div{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:#071021;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 0 18px rgba(var(--acc-rgb),.5)}
@media (max-width:560px){.tr-b{grid-template-columns:minmax(0,1fr)}.tr-x{padding:4px 0}.tr-x div{transform:rotate(90deg);width:32px;height:32px}}
details.more{border-top:1px solid var(--line)}
details.more summary{cursor:pointer;padding:10px 14px;font-size:13px;font-weight:600;color:var(--dim);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸ ";color:var(--acc)}
details.more[open] summary::before{content:"▾ "}
details.more ul{margin:0;padding:0 14px 12px 30px;font-size:13px}
details.more li{margin:4px 0}
details.more li.risk{color:var(--warn)}
.tr-a{display:flex;gap:8px;padding:0 14px 12px;flex-wrap:wrap}
/* buys & sells */
.bs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:620px){.bs{grid-template-columns:minmax(0,1fr)}}
.bs h3{margin:0 0 4px;font-family:var(--disp);font-size:14px;letter-spacing:.1em;display:flex;align-items:center;gap:8px}
.why{font-size:12px;color:var(--dim);margin:-2px 0 4px 56px;line-height:1.35}
/* power ranks */
.rank{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:13px}
.rank+.rank{border-top:1px solid var(--line)}
.rank .n{width:22px;font-family:var(--disp);font-size:16px;color:var(--dim);text-align:center}
.rank .bar{flex:1;min-width:0}
.rank .bar b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .bar span{display:block;height:5px;border-radius:3px;background:rgba(255,255,255,.07);margin-top:4px;overflow:hidden}
.rank .bar span i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.rank.me{background:rgba(var(--acc-rgb),.12);border-radius:10px}
.rank.me .n{color:var(--acc)}
/* donut */
.donut{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px;flex:1;min-width:120px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--pc)}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
/* age tracker */
.age{display:grid;grid-template-columns:34px minmax(0,1fr) 44px;align-items:center;gap:8px;margin:9px 0;font-size:12px}
.age .trk{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,rgba(62,232,143,.25),rgba(255,194,71,.25) 60%,rgba(255,84,104,.3))}
.age .dot{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--pc);box-shadow:0 0 10px var(--pc);border:2px solid #071021}
.age .lg{position:absolute;top:-3px;width:2px;height:16px;background:rgba(255,255,255,.6)}
.age .cl{position:absolute;top:-5px;bottom:-5px;width:0;border-left:2px dashed var(--bad)}
/* picks + rookies */
.pick{display:flex;align-items:center;gap:10px;padding:8px 4px}
.pick+.pick{border-top:1px solid var(--line)}
.pick .chip{font-family:var(--disp);font-size:17px;min-width:56px;text-align:center;padding:4px 8px;border-radius:10px;color:#071021;background:var(--PICK)}
.pick .chip.r1{background:linear-gradient(135deg,#ffd36b,#ff9a3d)}
.pick .chip.r2{background:linear-gradient(135deg,#b9c6ff,#8aa0ff)}
.pick .nm{flex:1;min-width:0;font-size:13px}
.pick .nm b{display:block}
.pick .nm small{color:var(--dim)}
.rk{display:flex;align-items:center;gap:10px;padding:6px 4px;font-size:13px}
.rk+.rk{border-top:1px solid var(--line)}
.rk .n{width:26px;font-family:var(--disp);font-size:15px;color:var(--dim);text-align:right}
.rk .nm{flex:1;min-width:0}
.rk .nm b{font-weight:600}
.rk .nm small{display:block;color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk.mine{background:rgba(var(--acc-rgb),.14);border-radius:10px;box-shadow:inset 3px 0 0 var(--acc)}
.mark{margin:6px 0;padding:6px 10px;border-radius:10px;font-size:12px;font-weight:700;letter-spacing:.04em;color:#071021;background:linear-gradient(90deg,var(--acc),var(--acc2));display:flex;justify-content:space-between}
.scroll{max-height:520px;overflow:auto;margin:0 -6px;padding:0 6px;scrollbar-width:thin}
/* priorities */
.prio{display:flex;gap:12px;padding:10px 0}
.prio+.prio{border-top:1px solid var(--line)}
.prio .ic{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:18px;background:rgba(var(--acc-rgb),.16);border:1px solid rgba(var(--acc-rgb),.45)}
.prio b{display:block;font-size:14px}
.prio small{color:var(--dim);font-size:12px}
/* matchup hero */
.mu{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px}

<script id="engine">
/* ================= TRADE ENGINE (pure functions) ================= */
const POS=['QB','RB','WR','TE'];
const SLOT_ELIG={QB:['QB'],RB:['RB'],WR:['WR'],TE:['TE'],FLEX:['RB','WR','TE'],WRRB_FLEX:['RB','WR'],REC_FLEX:['WR','TE'],SUPER_FLEX:['QB','RB','WR','TE']};
const AGE_CLIFF={QB:33,RB:27,WR:29,TE:30};
let REDRAFT=false;
// long absences only: a one-week "Out" isn't a dead roster spot
const INJ_ADJ_OUT={IR:1,PUP:1,NFI:1,Sus:1};
// any injury designation: never recommend these as targets
const HURT=new Set(['IR','Out','Doubtful','Questionable','PUP','NFI','Sus','NA','COV','DNR']);
// consolidation premium: value is compared as sum of (v/1000)^CONS_P, so one stud beats several average players
const CONS_P=1.5;
const SHAPE_MULT={'1x1':1,'2x1':.92,'1x2':.9,'2x2':.82,'3x1':.7};
const SHAPE_ORDER=['1x1','2x1','1x2','2x2','3x1'];
const SIMPLE_KEEP=.65;

function cv(vals){return vals.reduce((s,v)=>s+Math.pow(Math.max(0,v)/1000,CONS_P),0);}
function sortSlots(slots){return slots.filter(s=>SLOT_ELIG[s]).sort((a,b)=>SLOT_ELIG[a].length-SLOT_ELIG[b].length);}
function lineupDetail(players,slots,key){
  const av=players.filter(p=>p.kind==='player'&&POS.includes(p.pos)).sort((a,b)=>b[key]-a[key]);
  const used=new Array(av.length).fill(false);let total=0,filled=0;const starters=[];
  for(const s of slots){const el=SLOT_ELIG[s];for(let i=0;i<av.length;i++){if(!used[i]&&el.includes(av[i].pos)){used[i]=true;total+=av[i][key];filled++;starters.push(av[i]);break;}}}
  return {total,filled,starters};
}
function lineup(players,slots,key){return lineupDetail(players,slots,key).total;}
function ageFactor(a){
  if(REDRAFT)return 1;
  if(a.kind==='pick')return 1.08;
  const age=a.age;if(!age)return 1;
  const c=AGE_CLIFF[a.pos]||30;
  if(age<=23)return 1.18; if(age<=25)return 1.08; if(age<c-1)return 1;
  if(age<c)return .85; return .62;
}
function futureVal(assets){return assets.reduce((s,a)=>s+a.value*ageFactor(a),0);}
function isOld(a){return a.kind==='player'&&a.age&&a.age>=(AGE_CLIFF[a.pos]||30);}
function isYoung(a){return a.kind==='pick'||(a.age&&a.age<=24);}
function shortNote(s,n){s=String(s||'').replace(/\s+/g,' ').trim();n=n||110;return s.length>n?s.slice(0,n-1).replace(/[\s,;:.]+\S*$/,'')+'…':s;}

function buildModel(d){
  // d: {league, rosters, users, tradedPicks, fc, stats, season, draftDone, myUserId, redraft, players, news}
  REDRAFT=!!d.redraft;
  const L=d.league, nTeams=L.total_rosters||d.rosters.length;
  const rp=L.roster_positions||[];
  const slots=sortSlots(rp);
  const rosterLimit=rp.length; // starters + bench (IR and taxi are separate)
  const nQb=rp.filter(s=>s==='QB').length+(rp.includes('SUPER_FLEX')?1:0);
  const ptsKey=(L.scoring_settings&&L.scoring_settings.rec)>=1?'pts_ppr':(L.scoring_settings&&L.scoring_settings.rec)>0?'pts_half_ppr':'pts_std';
  const fcBy={},pickVals={};
  for(const e of d.fc){
    const p=e.player||{};
    if(p.position==='PICK'){
      const m=(p.name||'').match(/(\d{4})\s+(?:Round\s+(\d)|Pick\s+(\d)\.\d+|(\d)(?:st|nd|rd|th))/i);
      if(m){const k=m[1]+'-'+(m[2]||m[3]||m[4]);(pickVals[k]=pickVals[k]||{gen:null,list:[]});
        if(m[2]||m[4])pickVals[k].gen=e.value;else pickVals[k].list.push(e.value);}
      continue;
    }
    if(p.sleeperId)fcBy[String(p.sleeperId)]={name:p.name,pos:p.position,age:p.maybeAge?Math.floor(p.maybeAge):null,team:p.maybeTeam||'FA',
      value:e.value||0,redraft:REDRAFT?(e.value||0):(e.redraftValue??e.value??0),trend:e.trend30Day||0,posRank:e.positionRank,rank:e.overallRank};
  }
  const fallbackPick={1:5200,2:2300,3:1100,4:550,5:300};
  function pickValue(season,round){
    const k=season+'-'+round,pv=pickVals[k];
    if(pv){if(pv.gen)return pv.gen;if(pv.list.length)return pv.list.reduce((a,b)=>a+b,0)/pv.list.length;}
    const yrs=Object.keys(pickVals).filter(x=>x.endsWith('-'+round)).map(x=>+x.split('-')[0]).sort();
    if(yrs.length){const y=yrs[yrs.length-1];return pickValue(y,round)*Math.pow(.95,Math.max(0,season-y));}
    return fallbackPick[round]||200;
  }
  const userBy={};for(const u of d.users)userBy[u.user_id]=u;
  const teams=d.rosters.map(r=>{
    const u=userBy[r.owner_id]||{};
    const name=(u.metadata&&u.metadata.team_name)||u.display_name||('Team '+r.roster_id);
    const res=new Set(r.reserve||[]),taxi=new Set(r.taxi||[]);
    const ids=r.players||[];
    const players=ids.map(id=>{const f=fcBy[id];return f?{kind:'player',id,...f,onIR:res.has(id),onTaxi:taxi.has(id)}:null;}).filter(Boolean);
    const st=r.settings||{};

/* Targets (their players to buy), Sell-highs and Offload (mine) */
function tradeBoards(M){

      const newsBacked=p.news&&(p.news.tag==='role_up'||p.injDiscount);

      if(p.roleUp){kind='Rising role';why=p.news&&p.news.tag==='role_up'?shortNote(p.news.note):'Snaps up to '+pc(p.snapLast)+' last week'+(p.tgtShare?' with a '+pc(p.tgtShare)+' target share':'')+' — the market hasn’t caught up.';}

      else if(p.downWeek){kind='Buy low';why='Down week ('+p.lastWk.toFixed(1)+' vs '+p.avgPrior.toFixed(1)+' avg) — the manager may sell cheap.';}
      else if(p.trendPct<=-.06){kind='Buy low';why='Value down '+Math.abs(Math.round(p.trendPct*100))+'% in 30 days with his role intact.';}
      else if(!M.market&&!p.starter&&o.surplus.includes(p.pos)&&add>0){kind='Stuck on a deep roster';why='Benched behind '+o.name+'’s deep '+p.pos+' room — he’d start for you.';}

function teamWeights(mode){return REDRAFT?[.75,.25]:mode==='contend'?[.6,.4]:mode==='rebuild'?[.15,.85]:[.4,.6];}

function generateTrades(M,opts){

          const hook=oDS>.004||(!M.redraft&&opp.mode==='rebuild'&&oDF>.004)||mv>=1.04;
          if(!hook)continue;
          if(shape==='3x1'){
            // rare: only when I have the depth, my lineup clearly improves, and they need bodies at those spots
            if(dS<.01||newStarters.length<2||oppDelta<2)continue;
          }
          const edge=(rC-give.cons)/rC;
          let sig=0;
          get.forEach(x=>{if(x.buyLow)sig+=.004;if(x.roleUp)sig+=.004;if(x.sellHigh)sig-=.004;});
          give.forEach(x=>{if(x.sellHigh)sig+=.004;if(x.offload)sig+=.005;if(x.buyLow)sig-=.004;if(x.ageCliff&&mode!=='contend')sig+=.003;});
          const accept=Math.max(10,Math.min(92,Math.round((55+oppU*700+(mv-1)*120)*mgrFactor(opp.mgr))));
          const rank=(myGain+sig+band.edgeW*edge*.05)*SHAPE_MULT[shape]*(.6+accept/250);
          if(rank<=0)continue;
          const key=opp.rid+'|'+t.id+'|'+shape;
          const rank2=M.redraft?rank*(1+Math.min(1,dP/6)):rank;
          if(!best[key]||best[key].rank<rank2)best[key]={opp,give,get,drops,gv:gR,rv:rR,gc:give.cons,rc:rC,mv,dS,dF,oDS,oDF,oppU,edge,accept,rank:rank2,mode,shape,newStarters,myGain,myAfter,myL,myP,dP};
        }
      }
    }
  }
  // per target, keep the simplest deal that is nearly as good as the best one (1-for-1 beats a 2-for-2 that adds little)
  const byTarget={};
  for(const tr of Object.values(best)){const k=tr.opp.rid+'|'+tr.get[0].id;(byTarget[k]=byTarget[k]||[]).push(tr);}
  let list=Object.values(byTarget).map(c=>{
    const top=Math.max(...c.map(x=>x.rank));
    return c.filter(x=>x.rank>=top*SIMPLE_KEEP).sort((a,b)=>SHAPE_ORDER.indexOf(a.shape)-SHAPE_ORDER.indexOf(b.shape)||b.rank-a.rank)[0];
  }).sort((a,b)=>b.rank-a.rank);
  if(only){list.forEach(tr=>{tr.mgrLine=mgrLine(tr.opp);tr.mgrNotes=(tr.opp.mgr&&tr.opp.mgr.notes)||[];tr.gainLine=gainLine(tr,M);tr.acceptLine=acceptLine(tr,M);tr.reasons=explain(tr,M);});return list;}
  // at most 2 per opponent, one 3-for-1 at most, no reused give-asset among the top 3, no asset offered more than twice
  const perOpp={},usedGive=new Set(),giveCount={},out=[];let n31=0;
  for(const tr of list){
    if((perOpp[tr.opp.rid]||0)>=2)continue;
    if(tr.shape==='3x1'&&n31>=1)continue;
    if(out.length<3&&tr.give.some(g=>usedGive.has(g.id)))continue;
    if(tr.give.some(g=>(giveCount[g.id]||0)>=2))continue;
    if(out.some(o=>o.opp===tr.opp&&o.get.some(x=>tr.get.includes(x))))continue;
    out.push(tr);perOpp[tr.opp.rid]=(perOpp[tr.opp.rid]||0)+1;tr.give.forEach(g=>{usedGive.add(g.id);giveCount[g.id]=(giveCount[g.id]||0)+1;});if(tr.shape==='3x1')n31++;

}

const RATE_F={never:.6,rare:.8,active:1,'very active':1.1};
function mgrFactor(mg){if(!mg)return 1;return (RATE_F[mg.tradeRate]||1)*(mg.stance==='contender'?.85:mg.stance==='desperate'?1.1:1);}
/* a rejected offer covers any new one for the same main target that gives no more than ~10% extra */
function refusedRef(mg,get,M){
  if(!mg||!mg.rejected)return [];
  const val=id=>{for(const t of M.teams){const a=t.assets.find(x=>x.id===id);if(a)return a.value;}return 0;};
  const top=get.slice().sort((a,b)=>b.value-a.value)[0];
  return mg.rejected.filter(r=>top&&r.get.includes(top.id)).map(r=>({...r,gv:r.give.reduce((s,id)=>s+val(id),0),rv:r.get.reduce((s,id)=>s+val(id),0)}));
}
function refusedBefore(mg,give,get,M){
  const gv=give.reduce((s,a)=>s+a.value,0),rv=get.reduce((s,a)=>s+a.value,0);
  return refusedRef(mg,get,M).some(r=>gv<=r.gv*1.1&&rv>=r.rv*.9);
}
function mgrLine(o){
  const mg=o.mgr;if(!mg)return '';
  const ord=n=>n+(['th','st','nd','rd'][n%100>10&&n%100<14?0:n%10]||'th');
  const rate={never:'never trades',rare:'rarely trades',active:'trades regularly','very active':'trades a lot'}[mg.tradeRate]||'';
  const st={contender:'contender: only deals that help their lineup now',bubble:'on the playoff bubble',chaser:'chasing a playoff spot',desperate:'losing: open to shake-ups'}[mg.stance]||'';
  return mg.name+' · '+mg.record+', '+ord(mg.rank)+' · '+rate+' ('+mg.trades.season+' this season'+(mg.trades.last!=null?', '+mg.trades.last+' last':'')+') · '+st;
}
function gainLine(tr,M){
  const pct=x=>(x>=0?'+':'')+(x*100).toFixed(1)+'%';
  const d=Math.round(tr.rv-tr.gv);
  const pts=M.redraft&&tr.dP!=null?'Weekly points '+(tr.dP>=0?'+':'−')+Math.abs(tr.dP).toFixed(1)+' · ':'';
  return pts+'Starting lineup '+pct(tr.dS)+' · '+(M.redraft?'roster depth ':'long-term value ')+pct(tr.dF)+' · raw value '+(d>=0?'+':'−')+Math.abs(d).toLocaleString();
}
function acceptLine(tr,M){
  const o=tr.opp,bits=[];
  if(tr.oDS>.004){const ps=[...new Set(tr.newStarters.map(x=>x.pos))];bits.push('it fills their '+(ps.join('/')||'lineup')+' hole (their lineup +'+(tr.oDS*100).toFixed(1)+'%)');}
  if(!M.redraft&&o.mode==='rebuild'&&tr.give.some(isYoung))bits.push('a rebuilding team gets younger');
  if(tr.give.length<tr.get.length)bits.push('they consolidate into the best player in the deal');
  else if(tr.give.length>tr.get.length)bits.push('they turn one roster spot into '+tr.give.length+' useful pieces');
  if(tr.gv>=tr.rv)bits.push('they get more total value ('+Math.round(tr.gv).toLocaleString()+' vs '+Math.round(tr.rv).toLocaleString()+')');
  else if(tr.mv>=1)bits.push('they win on consolidated value');
  return bits.length?bits[0].charAt(0).toUpperCase()+bits.slice(0,2).join(', and ').slice(1)+'.':'Close to even on value and fits their roster.';
}

function explain(tr,M){
  const r=[],me=M.me,o=tr.opp;
  if(M.redraft&&tr.myP){
    const bI=new Set(me.baseP.starters.map(p=>p.id)),aI=new Set(tr.myP.starters.map(p=>p.id));
    const ins=tr.myP.starters.filter(p=>!bI.has(p.id)),outs=me.baseP.starters.filter(p=>!aI.has(p.id));
    const f=p=>p.name+' ~'+p.wpts.toFixed(1);
    r.push('Weekly points: your starters go from '+me.baseP.total.toFixed(1)+' to '+tr.myP.total.toFixed(1)+' ('+(tr.dP>=0?'+':'')+tr.dP.toFixed(1)+')'+(ins.length?': '+ins.map(f).join(', ')+' in for '+(outs.map(f).join(', ')||'an empty slot'):'')+'.');
  }
  tr.get.forEach(x=>{
    if(x.news&&x.news.note)r.push(x.name+': '+x.news.note);
    else if(x.roleUp&&x.snapDelta>=.12)r.push(x.name+'’s role is growing: '+Math.round(x.snapLast*100)+'% of snaps last week. Buy before the market catches up.');
    else if(x.downWeek)r.push(x.name+' just had a down week ('+x.lastWk.toFixed(1)+' vs '+x.avgPrior.toFixed(1)+' avg). Buy before he bounces.');
    else if(x.buyLow&&x.trendPct<=-.06)r.push(x.name+' has dropped '+Math.abs(Math.round(x.trendPct*100))+'% in value over 30 days — buy-low window.');
    if(x.kind==='player'&&me.needs.includes(x.pos))r.push('Fills a weak spot: '+x.pos+' (you rank '+me['pr_'+x.pos]+' of '+M.nTeams+').');
  });
  tr.give.forEach(x=>{
    if(x.news&&x.news.note)r.push('Selling '+x.name+': '+x.news.note);
    else if(x.tdLuck)r.push('Selling '+x.name+' while touchdowns ('+Math.round(x.tdShare*100)+'% of his points) prop up his value.');
    else if(x.spikeWeek)r.push('Selling '+x.name+' right after a spike week ('+x.lastWk.toFixed(1)+' pts).');
    else if(x.sellHigh)r.push(x.name+' is up '+Math.round(x.trendPct*100)+'% in 30 days — sell at the top.');
    else if(x.roleDown)r.push(x.name+'’s snaps are falling — move him before his value does.');
    if(x.ageCliff)r.push(x.name+' is '+x.age+' — past the '+x.pos+' age cliff.');
  });
  if(tr.drops.length)r.push('To stay at the roster limit, drop '+tr.drops.map(x=>x.name).join(' and ')+' (bench, low value).');
  else if(tr.get.length<tr.give.length)r.push('Opens '+(tr.give.length-tr.get.length)+' roster spot'+(tr.give.length-tr.get.length>1?'s':'')+' for a waiver add.');

}

/* Buy-low game plan: the best offer from my roster for each target on the board */
const AGGR_STEPS=['balanced','aggressive','max'];
function targetPlans(M,opts){
  const out=[];
  for(const t of (M.boards.targets||[]).slice(0,6)){
    let trade=null,stretch=false;const start=Math.max(0,AGGR_STEPS.indexOf(opts.aggr));
    for(let i=start;i<AGGR_STEPS.length&&!trade;i++){
      const list=generateTrades(M,{...opts,aggr:AGGR_STEPS[i],only:{rid:t.owner.rid,id:t.p.id}});
      if(list.length){trade=list[0];stretch=i>start;}
    }
    out.push({target:t,trade,stretch});
  }
  return out;
}

/* What a trade really does to my roster, with an unvarnished verdict */
function consequences(tr,M){
  const me=M.me,lines=[],risks=[];

  // depth: bench players at each position involved who could start in a pinch
  const allStarters=M.teams.flatMap(t=>t.baseL.starters);
  const poss=[...new Set([...tr.give,...tr.get].filter(a=>a.kind==='player').map(a=>a.pos))];
  for(const p of poss){
    const sv=allStarters.filter(x=>x.pos===p).map(x=>x.redraft).sort((a,b)=>a-b);
    const floor=(sv[Math.floor(sv.length/2)]||0)*.45;
    const bench=(set,st)=>set.filter(x=>x.kind==='player'&&x.pos===p&&!st.has(x.id)&&!x.hurt&&x.redraft>=floor).length;
    const b0=bench(me.players,bI),b1=bench(tr.myAfter,aI);

  const open=nP(tr.give)-nP(tr.get);

  else if(open>0)lines.push('Roster spots: opens '+open+' — use '+(open>1?'them':'it')+' on the best waiver add at your thinnest spot.');
  else if(open<0)lines.push('Roster spots: uses '+(-open)+' open spot'+(open<-1?'s':'')+'.');
  // consolidation check
  if(tr.give.length>tr.get.length){
    const star=tr.get.reduce((a,b)=>b.value>a.value?b:a);
    if(star.kind==='player'&&!aI.has(star.id))risks.push(star.name+' wouldn’t start for you — that’s giving up depth for a bench player.');
    else lines.push('Consolidation: '+tr.give.length+' pieces become 1 better starter. Fewer bodies, stronger lineup.');
  }else if(tr.get.length>tr.give.length)lines.push('Depth play: you split one asset into '+tr.get.length+' pieces.');
  // long-term
  if(!M.redraft){
    const avgAge=g=>{const a=g.filter(x=>x.kind==='player'&&x.age).map(x=>x.age);return a.length?a.reduce((s,v)=>s+v,0)/a.length:null;};
    const ag=avgAge(tr.give),ar=avgAge(tr.get);
    lines.push('Long-term value '+pct(tr.dF)+(ag&&ar&&Math.abs(ag-ar)>=.5?'; you get '+Math.abs(ag-ar).toFixed(1)+' years '+(ar<ag?'younger':'older')+' on average':'')+'.');
    const picks=tr.give.filter(a=>a.kind==='pick');
    if(picks.length)lines.push('Draft capital out: '+picks.map(a=>a.name).join(', ')+'.');
    tr.get.forEach(x=>{if(x.kind==='player'&&(isOld(x)||x.nearCliff))risks.push(x.name+' is '+x.age+' — '+x.pos+' value falls fast around '+AGE_CLIFF[x.pos]+'.');});

  const top=tr.get.reduce((a,b)=>b.value>a.value?b:a);

  // helping a rival
  refusedRef(tr.opp.mgr,tr.get,M).forEach(r=>{const nm=ids=>ids.map(id=>{for(const t of M.teams){const a=t.assets.find(x=>x.id===id);if(a)return a.name;}return id;}).join(' + ');
    risks.push(tr.opp.mgr.name+' already turned down '+nm(r.give)+' for '+nm(r.get)+' ('+r.date+')'+(refusedBefore(tr.opp.mgr,tr.give,tr.get,M)?' — this offer isn’t meaningfully better.':'.'));});

    else{verdict='Small edge';tone='gold';}
    lines.unshift('Weekly points: '+(tr.dP>=0?'+':'')+tr.dP.toFixed(1)+' for your starters (recent points per game, steadied by market value and this week’s projection).');
    return {verdict,tone,lines,risks};
  }
  if(g>=.03&&!risks.length){verdict='Strong yes';tone='up';}
  else if(g>=.015){verdict=risks.length?'Yes, with a catch':'Yes';tone=risks.length?'gold':'up';}
  else{verdict=risks.length>=2?'Pass unless you need it':'Small edge';tone=risks.length>=2?'down':'gold';}
  return {verdict,tone,lines,risks};
}
/* Score a specific proposed trade (e.g. one offered to me) on the same terms */
function checkTrade(M,giveIds,getIds){

  const tr={opp,give,get,drops:[],gv:give.reduce((s,a)=>s+a.value,0),rv:get.reduce((s,a)=>s+a.value,0),dS,dF,oDS:(oL.total-opp.baseL.total)/M.avgStarter,myGain:W[0]*dS+W[1]*dF,myAfter,myL,myP,dP:myP?myP.total-me.baseP.total:null,newStarters:give.filter(a=>oL.starters.includes(a))};
  tr.mgrLine=mgrLine(opp);tr.mgrNotes=(opp.mgr&&opp.mgr.notes)||[];tr.gainLine=gainLine(tr,M);tr.reasons=explain(tr,M);tr.cq=consequences(tr,M);return tr;
}

      if(g.total)for(const k of ['home','away'])g[k+'Implied']=Math.round((g.total/2+(g[k]===g.fav?g.spread/2:g.fav?-g.spread/2:0))*10)/10;}
    return g;});
}

/* ================= DYNASTY ================= */
function renderDynasty(D){
  const M=D.M,me=M.me,n=M.nTeams,T=M.teams;
  const fR=rankBy(T,t=>t.future).get(me),sR=me.starterRank,vR=me.totalRank;
  const third=Math.ceil(n/3),top=r=>r<=third,bot=r=>r>n-third;
  const arch=top(sR)&&top(fR)?'Dynasty Juggernaut':top(sR)?'Win-Now Window':bot(sR)&&top(fR)?'Rising Rebuild':bot(sR)&&bot(fR)?'Full Teardown':top(fR)?'One-Year Reload':'Push or Pivot';
  const totV=me.assets.reduce((s,a)=>s+a.value,0)||1;
  const share={};['QB','RB','WR','TE','PICK'].forEach(p=>share[p]=me.assets.filter(a=>(a.kind==='pick'?'PICK':a.pos)===p).reduce((s,a)=>s+a.value,0)/totV);
  const wAge=ps=>{const a=ps.filter(p=>p.age&&p.value>=300);const w=a.reduce((s,p)=>s+p.value,0);return w?a.reduce((s,p)=>s+p.age*p.value,0)/w:null;};
  const myAge=wAge(me.players);
  const heavy=['QB','RB','WR','TE'].find(p=>share[p]>.42);
  const rArch=heavy?heavy+'-Heavy':myAge&&myAge<25?'Young Core':myAge&&myAge>27.3?'Veteran Heavy':'Well Rounded';
  const y1={contend:'Contend',fringe:'Compete',rebuild:'Rebuild'}[me.mode],y2=top(fR)?'Contend':bot(fR)?'Rebuild':'Reload';
  const oc=x=>x==='Contend'?'t-good':x==='Rebuild'?'t-bad':'t-warn';
  const pc=r=>(n-r)/Math.max(1,n-1);
  const overall=1+9*(pc(sR)+pc(vR)+pc(fR))/3;
  // blueprint
  const bp=panel('Team Blueprint','▣','<div style="display:flex;gap:14px;align-items:center"><div class="ring" style="--p:'+Math.round(overall*10)+';--c:'+gColor(overall)+'"><div><b>'+overall.toFixed(1)+'</b><small>Overall</small></div></div>'+
    '<div style="min-width:0"><div class="bp-k">Value archetype</div><div class="bp-v">'+esc(arch)+'</div><div class="bp-k" style="margin-top:8px">Roster archetype</div><div class="bp-v" style="font-size:17px">'+esc(rArch)+'</div></div></div>'+
    '<div class="bp-k" style="margin-top:14px">2-year outlook</div><div class="outlook"><span class="ob '+oc(y1)+'"><small>'+esc(M.teams.length&&D.league.season)+'</small>'+y1+'</span><span class="muted">➜</span><span class="ob '+oc(y2)+'"><small>'+(+D.league.season+1)+'</small>'+y2+'</span></div>',{glow:true});
  // lineup
  const S=myStarters(D);
  const lu=panel('Starting Lineup','☰','<div class="plist">'+S.list.map(x=>{const p=pinfo(x.id);return prow(x.id,{slot:x.slot,s:38,right:fmt(p.value),rsub:'value'});}).join('')+'</div>',{right:'<small>Week '+SH.week+'</small>'});
  // priorities

  // vegas board

/* ================= BETS ================= */
const BETS={loaded:false};
const jget=(k,d)=>{try{return JSON.parse(store.get(k)||'')||d}catch(e){return d}};
const jset=(k,v)=>store.set(k,JSON.stringify(v));
const money=x=>(x<0?'−$':'$')+Math.abs(x).toFixed(2);
async function ensureBets(){if(!BETS.loaded){const [k,b]=await Promise.all([local('kalshi.json'),local('bets.json')]);BETS.k=k;BETS.b=b;BETS.loaded=true;}}
function bank(){const b=jget('bank',{});return {week:b.week??'50',day:b.day??'10',ledger:b.ledger||[]};}
function saveBank(b){jset('bank',b);}
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'America/Los_Angeles'});
function weekStart(){const d=new Date(today()+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return d.toLocaleDateString('en-CA');}
function ledgerStats(b){
  const t=today(),w=weekStart(),pl=x=>x.res==='W'?x.pay-x.stake:x.res==='L'?-x.stake:0;
  const wk=b.ledger.filter(x=>x.d>=w),td=b.ledger.filter(x=>x.d===t);
  return {wkStake:wk.reduce((s,x)=>s+x.stake,0),wkPL:wk.reduce((s,x)=>s+pl(x),0),tdStake:td.reduce((s,x)=>s+x.stake,0),tdPL:td.reduce((s,x)=>s+pl(x),0),
    pl:b.ledger.reduce((s,x)=>s+pl(x),0),w:b.ledger.filter(x=>x.res==='W').length,l:b.ledger.filter(x=>x.res==='L').length,open:b.ledger.filter(x=>x.res==='open').length};
}
// payout from a Kalshi price (0.62) or American odds (-150 / +120)
function payout(stake,price){price=String(price||'').trim();const v=parseFloat(price.replace(/[^\d.+-]/g,''));
  if(!(stake>0)||!isFinite(v))return null;
  if(/^\$?0?\.\d+$/.test(price.replace('$',''))||(v>0&&v<1))return stake/v;

  if(R||n)h+='<div class="pf-sec"><h3>Latest news'+(n&&n.tag?' <span class="tag t-acc">'+esc(n.tag.replace('_',' '))+'</span>':'')+'</h3>'+
    (R&&R.headline?'<p class="hl">'+esc(R.headline)+'</p>':'')+(R&&R.news?'<p class="body">'+esc(R.news)+'</p>':'')+
    (n&&n.note&&(!R||!R.news||n.auto)?'<p class="body">'+(n.auto?'<span class="tag t-warn">live</span> ':'')+esc(n.note)+'</p>':'')+
    (R&&(R.sources||[]).length?'<div class="srcs">'+R.sources.slice(0,5).map(s=>'<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.title)+'</a>').join('')+'</div>':'')+'</div>';
  if(R&&R.take)h+='<div class="pf-sec take"><h3>War Room take <span class="muted" style="font-weight:400;letter-spacing:0;text-transform:none">· '+esc(R.updated||SH.reports.updated||'')+'</span></h3>'+
    '<div class="verd"><span>Dynasty '+vc(R.dynasty)+'</span><span>Redraft '+vc(R.redraft)+'</span></div><p class="body">'+esc(R.take)+'</p>'+
    ((R.points||[]).length?'<ul>'+R.points.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')+(R.handcuff?'<p class="body"><b>Handcuff:</b> '+esc(R.handcuff)+'</p>':'')+'</div>';
  return h;
}
function openRookie(i){
  const r=(SH.rookies&&SH.rookies.players||[])[i];if(!r)return;
  $('drawer').innerHTML='<div class="pf-top" style="--pc:'+(POSC[r.pos]||'var(--dim)')+'"><span class="big">#'+r.rank+'</span><button class="x" type="button" id="pfX" aria-label="Close">✕</button><div class="pf-id">'+face(null,r.name,r.pos,96)+'<div><h2>'+esc(r.name)+'</h2><div class="meta">'+posTag(r.pos)+esc(r.school||'')+(r.year?' · '+esc(r.year):'')+'</div><div class="meta"><span class="tag t-acc">'+SH.rookies.class+' class · tier '+r.tier+'</span></div></div></div></div>'+
    '<div class="pf-sec"><h3>Scouting note</h3><p class="body">'+esc(r.note||'')+'</p><p class="muted" style="font-size:12px">Consensus superflex rookie rank #'+r.rank+' (updated '+esc(SH.rookies.updated)+').</p></div>';
  $('drawer').classList.add('on');$('scrim').classList.add('on');$('drawer').setAttribute('aria-hidden','false');$('pfX').onclick=closeProfile;$('pfX').focus();
}
function openProfile(id){
  const p=pinfo(id),pl=p.pl||{},gm=gameOf(p.team),pj=projOf(id),D=CUR;
  const ht=pl.h?Math.floor(pl.h/12)+'′'+(pl.h%12)+'″':null;
  const pts=SH.stats.data.map((w,i)=>{const s=w[id]||{};const k=D.M.ptsKey;return {wk:SH.stats.weeks[i],v:s[k]!=null?s[k]:null};});
  const mx=Math.max(10,...pts.map(x=>x.v||0));
  const mineP=D.M.me.players.some(x=>x.id===id),locked=locks(D.lid).has(id);
  const n=p.news;
  const tags=[p.buyLow&&'<span class="tag t-good">buy low</span>',p.sellHigh&&'<span class="tag t-warn">sell high</span>',p.roleUp&&'<span class="tag t-good">role ▲</span>',p.roleDown&&'<span class="tag t-bad">role ▼</span>',p.ageCliff&&'<span class="tag t-bad">age cliff</span>',p.starter&&'<span class="tag t-acc">starter</span>'].filter(Boolean).join(' ');
  $('drawer').innerHTML='<div class="pf-top" style="--pc:'+(POSC[p.pos]||'var(--dim)')+'"><span class="big">'+(pl.no??p.pos??'')+'</span><button class="x" type="button" id="pfX" aria-label="Close">✕</button>'+
    '<div class="pf-id">'+face(id,p.name,p.pos,104,true)+'<div><h2>'+esc(p.name)+'</h2><div class="meta">'+posTag(p.pos)+logo(p.team)+esc(p.team||'FA')+(pl.no!=null?' · #'+esc(pl.no):'')+' '+injTag(p.inj)+'</div>'+
    '<div class="meta">'+[p.age&&'Age '+p.age,ht,pl.w&&pl.w+' lb',pl.c,pl.x!=null&&(pl.x===0?'Rookie':'Yr '+(pl.x+1))].filter(Boolean).map(esc).join(' · ')+'</div>'+
    '<div class="meta">'+(p.owner?(p.owner===D.M.me?'<span class="tag t-acc">your team</span>':'Owner: '+esc(p.owner.name)):'<span class="tag t-good">free agent</span>')+' '+tags+'</div></div></div></div>'+
    '<div class="pf-sec"><div class="stats"><div class="st"><small>'+(D.mode==='dynasty'?'Dynasty value':'Trade value')+'</small><b>'+(p.value?fmt(p.value):'—')+'</b></div><div class="st"><small>30-day trend</small><b class="'+(p.trendPct>0?'up':p.trendPct<0?'down':'')+'">'+(p.trendPct?(p.trendPct>0?'+':'')+Math.round(p.trendPct*100)+'%':'—')+'</b></div>'+
    '<div class="st"><small>Wk '+SH.week+' proj</small><b>'+(pj!=null?pj.toFixed(1):'—')+'</b></div><div class="st"><small>Snap share</small><b>'+(p.snap!=null?pct(p.snap):'—')+'</b></div><div class="st"><small>Target share</small><b>'+(p.tgtShare!=null?pct(p.tgtShare):'—')+'</b></div><div class="st"><small>Pos rank</small><b>'+(p.posRank?p.pos+p.posRank:'—')+'</b></div></div></div>'+
    '<div class="pf-sec"><h3>This week</h3>'+(gm&&gm.bye?'<b class="t-bad">Bye week</b>':gm?'<div style="display:flex;align-items:center;gap:10px;font-size:14px">'+logo(p.team)+'<b>'+esc(p.team)+'</b> '+(gm.home?'vs':'@')+' '+logo(gm.opp)+'<b>'+esc(gm.opp)+'</b><span class="muted">'+esc(kick(gm.g.kickoff))+'</span></div><div class="stats" style="margin-top:10px"><div class="st"><small>Spread</small><b>'+(gm.line!=null?sgn(gm.line):'—')+'</b></div><div class="st"><small>Over/under</small><b>'+(gm.total||'—')+'</b></div><div class="st"><small>Team total</small><b>'+(gm.implied||'—')+'</b></div></div>':'<span class="muted">No game data.</span>')+'</div>'+
    '<div class="pf-sec"><h3>Recent weeks · fantasy points</h3>'+(pts.length?'<div class="spark">'+pts.map(x=>'<div><b>'+(x.v!=null?x.v.toFixed(1):'—')+'</b><i style="height:'+Math.round((x.v||0)/mx*60)+'px"></i>Wk '+x.wk+'</div>').join('')+'</div>':'<span class="muted">No recent stats.</span>')+'</div>'+
    reportHtml(id,p)+
    '<div class="pf-sec"><h3>Usage · last '+SH.stats.weeks.length+' weeks</h3>'+usageHtml(id,p)+'</div>'+depthHtml(id,p)+
    (mineP?'<div class="pf-sec"><button class="btn'+(locked?' pri':'')+'" type="button" id="pfLock">'+(locked?'🔒 Untouchable — tap to allow trades':'🔓 Mark untouchable (never offer in trades)')+'</button></div>':'')+
    '<div class="pf-sec"><a class="btn" href="https://sleeper.com/players/nfl/'+esc(id)+'" target="_blank" rel="noopener">Open on Sleeper ↗</a></div>';
  $('drawer').classList.add('on');$('scrim').classList.add('on');$('drawer').setAttribute('aria-hidden','false');
  $('pfX').onclick=closeProfile;$('pfX').focus();
  if($('pfLock'))$('pfLock').onclick=()=>{toggleLock(D.lid,id);D.trades=genTrades(D);D.plans=genPlans(D);render();openProfile(id);};
}
function closeProfile(){$('drawer').classList.remove('on');$('scrim').classList.remove('on');$('drawer').setAttribute('aria-hidden','true');}

/* ================= RENDER + EVENTS ================= */
function tradeMsg(tr){
  const g=tr.give.map(a=>a.name).join(' + '),r=tr.get.map(a=>a.name).join(' + '),o=tr.opp;
  const hit=tr.give.find(x=>x.kind==='player'&&o.needs.includes(x.pos));
  const pitch=hit?' Looks like you could use help at '+hit.pos+'.':o.mode==='rebuild'?' Figured you might want to get younger.':' Should help your push this year.';
  return 'Hey '+o.owner+', would you do '+g+' for '+r+'?'+pitch+' Sending it on Sleeper now.';
}
function render(){
  if(MODE==='bets'){document.body.dataset.mode=MODE;$('view').innerHTML=renderBets();bindBets();
    document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===MODE));
    $('foot').textContent='Kalshi quotes: public market data snapshot'+(BETS.k?' ('+BETS.k.updated+')':'')+' · Scan: '+(BETS.b?BETS.b.scanned:'none yet')+' · Research only — no orders are placed from this page.';return;}
  const D=CACHE[MODE];if(!D||D instanceof Promise)return;
  CUR=D;document.body.dataset.mode=MODE;
  $('view').innerHTML=MODE==='dynasty'?renderDynasty(D):renderRedraft(D);
  document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===MODE));
  const g=SH.games,srcTxt=s=>s==='live'?'live':s==='file'?'site file ('+(g.fileUpdated||'?')+')':'unavailable';
  $('foot').textContent='Values: FantasyCalc · Rosters, injuries, projections: Sleeper · Lines: ESPN ('+srcTxt(g.src.games)+') · Projections: '+srcTxt(g.src.proj)+(SH.news&&SH.news.updated?' · News: '+SH.news.updated:'')+(SH.news&&SH.news.statusChecked?' · Last status change: '+SH.news.statusChecked:'');
}
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-copy]');
  if(c){const tr=CUR.trades[+c.dataset.copy];navigator.clipboard.writeText(tradeMsg(tr)).then(()=>{c.textContent='Copied ✓';},()=>prompt('Copy this message:',tradeMsg(tr)));return;}
  const s=e.target.closest('[data-seg] button');
  if(s){const k=s.parentElement.dataset.seg;store.set(k==='aggr'?'aggr_'+MODE:k,s.dataset.v);CUR.trades=genTrades(CUR);CUR.plans=genPlans(CUR);render();return;}
  const rk=e.target.closest('[data-rook]');if(rk){openRookie(+rk.dataset.rook);return;}
  const p=e.target.closest('[data-pid]');if(p&&!e.target.closest('a')){e.stopPropagation();openProfile(p.dataset.pid);return;}
});
$('scrim').onclick=closeProfile;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeProfile();});
document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{if(MODE===b.dataset.mode)return;MODE=b.dataset.mode;store.set('mode',MODE);closeProfile();if(SH&&SH.partial&&MODE!=='bets'){SH=null;boot();}else show();});
$('refresh').onclick=()=>{for(const k in CACHE)delete CACHE[k];SH=null;BETS.loaded=false;boot();};
function msg(t,err){$('msg').innerHTML=t?'<div class="msg'+(err?' err':'')+'">'+esc(t)+'</div>':'';}
function ensure(mode){if(!CACHE[mode])CACHE[mode]=loadMode(mode).then(D=>CACHE[mode]=D,e=>{delete CACHE[mode];throw e;});return Promise.resolve(CACHE[mode]);}
async function show(){
  document.body.dataset.mode=MODE;document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===MODE));
  if(MODE==='bets'){try{msg('');await ensureBets();render();}catch(e){msg(e.message,true);}return;}
  if(CACHE[MODE] instanceof Promise||!CACHE[MODE])$('view').innerHTML='<div class="loading"><div class="spin"></div>Building your '+(MODE==='dynasty'?'dynasty blueprint':'week '+(SH?SH.week:'')+' game plan')+'…</div>';
  try{msg('');await ensure(MODE);render();$('stamp').textContent='Updated '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});}
  catch(e){msg(e.message,true);$('view').innerHTML='';}
}
async function boot(){
  $('refresh').disabled=true;
  $('view').innerHTML='<div class="loading"><div class="spin"></div>Loading rosters, values, Vegas lines and projections…</div>';
  try{try{SH=await loadShared();}catch(e){if(MODE!=='bets')throw e;SH={games:{games:[],proj:{},src:{games:'none',proj:'none'}},stats:{weeks:[],data:[]},PL:{},week:0,partial:true};}
    await show();
    if(!SH.partial)['dynasty','redraft'].filter(m=>m!==MODE).forEach((m,i)=>setTimeout(()=>ensure(m).catch(()=>{}),400+i*300));}
  catch(e){msg(e.message,true);$('view').innerHTML='';}
  $('refresh').disabled=false;
}
boot();
</script>
</body>
